name: Release

# Runs when a version tag is pushed, for example v1.0.1.
# Builds the Windows installer and portable exe and publishes them as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so release notes can list commits since the previous tag.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Check that the tag matches package.json
        shell: bash
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in package.json ($VERSION). Use 'npm run release' so they are bumped together, or delete the tag and re-tag the right commit."
            exit 1
          fi
          echo "Releasing $VERSION"

      - run: npm ci

      - name: Build the game
        run: npm run build

      # Created as a draft so players and the in-game updater never see a release
      # that is still missing its files. Notes are generated from commits since the last tag.
      - name: Create draft release with generated notes
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" --draft --generate-notes --title "BusinessSim $GITHUB_REF_NAME"

      # Uploads the installer, its .blockmap, latest.yml and the portable exe to the draft.
      - name: Build and upload
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing: uncomment once the secrets exist (see electron-builder.yml).
          # CSC_LINK: ${{ secrets.CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Check the release has everything the updater needs
        shell: bash
        run: |
          ASSETS="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          echo "$ASSETS"
          for NEEDED in latest.yml "Setup-${GITHUB_REF_NAME#v}.exe" "Setup-${GITHUB_REF_NAME#v}.exe.blockmap" "Portable-${GITHUB_REF_NAME#v}.exe"; do
            if ! echo "$ASSETS" | grep -q "$NEEDED"; then
              echo "::error::The release is missing a file matching '$NEEDED'. It has been left as a draft."
              exit 1
            fi
          done

      - name: Publish the release
        shell: bash
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
